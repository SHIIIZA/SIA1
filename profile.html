<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripMate — Profile Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body class="dashboard-page profile-page">

    <header class="dashboard-nav stagger-in stagger-in-1">
        <a href="homepage.html" class="logo">
            <img src="images/tripmateo.svg" alt="TripMate" class="logo-img">
        </a>
        <nav class="dashboard-tabs">
            <a href="dashboard.html" data-tab="trips">Trips</a>
            <a href="wishlist.html" data-tab="wishlist">Wishlist</a>
            <a href="profile.html" class="active" data-tab="profile">Profile</a>
        </nav>
        <div class="user-menu" id="userMenu">
            <button class="user-avatar-btn" id="userAvatarBtn" aria-label="User menu">
                <span class="avatar-placeholder" id="avatarPlaceholder">JD</span>
            </button>
            <div class="user-dropdown" id="userDropdown">
                <div class="dropdown-header">
                    <span class="dropdown-name" id="dropdownName">Juan Dela Cruz</span>
                    <span class="dropdown-email" id="dropdownEmail">juan@example.com</span>
                </div>
                <hr class="dropdown-divider">
                <a href="dashboard.html" class="dropdown-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span>My Trips</span>
                </a>
                <a href="wishlist.html" class="dropdown-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    <span>Wishlist</span>
                </a>
                <a href="profile.html" class="dropdown-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span>Profile</span>
                </a>
                <hr class="dropdown-divider">
                <a href="#" class="dropdown-item" id="logoutBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Log out</span>
                </a>
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <div class="dashboard-container">
            <section class="dashboard-content profile-content stagger-in stagger-in-2">
                <div class="content-header">
                    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 6h16M7 12h10M10 18h4" />
                        </svg>
                    </button>
                    <h1 id="contentTitle">Profile Settings</h1>
                </div>

                <div class="profile-sections">
                    <!-- Account Section -->
                    <section class="profile-section stagger-in stagger-in-3" id="accountSection">
                        <div class="section-header">
                            <h2>Account Information</h2>
                        </div>
                        <form class="profile-form" id="accountForm">
                            <div class="profile-avatar-row">
                                <!-- Avatar upload removed per user request -->
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="firstName">First Name</label>
                                        <input type="text" id="firstName" name="firstName" class="form-input" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="lastName">Last Name</label>
                                        <input type="text" id="lastName" name="lastName" class="form-input" required>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="email">Email Address</label>
                                    <input type="email" id="email" name="email" class="form-input" required>
                                </div>

                                <div class="form-group">
                                    <label for="phone">Phone Number</label>
                                    <input type="text" id="phone" name="phone" class="form-input">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="bio">Bio</label>
                                <textarea id="bio" name="bio" class="form-input" rows="3"></textarea>
                            </div>
                        </form>
                    </section>

                    <!-- Security Section -->
                    <section class="profile-section stagger-in stagger-in-4" id="securitySection">
                        <div class="section-header">
                            <h2>Security</h2>
                        </div>
                        <form class="profile-form" id="securityForm">
                            <div class="form-group">
                                <label for="currentPassword">Current Password</label>
                                <input type="password" id="currentPassword" name="currentPassword" class="form-input" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="newPassword">New Password</label>
                                    <input type="password" id="newPassword" name="newPassword" class="form-input" required>
                                </div>
                                <div class="form-group">
                                    <label for="confirmPassword">Confirm Password</label>
                                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required>
                            </div>
                            </div>
                        </form>
                    </section>

                    <!-- Notifications Section -->
                    <section class="profile-section stagger-in stagger-in-5" id="notificationsSection">
                        <div class="section-header">
                            <h2>Notifications</h2>
                        </div>
                        <div class="notification-settings">
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="notifBooking" name="notifBooking">
                                    <span>Booking updates</span>
                                </label>
                            </div>
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="notifPayment" name="notifPayment">
                                    <span>Payment confirmations</span>
                                </label>
                            </div>
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="notifReminders" name="notifReminders">
                                    <span>Travel reminders</span>
                                </label>
                            </div>
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="notifPromo" name="notifPromo">
                                    <span>Promotional offers</span>
                                </label>
                            </div>
                        </div>
                    </section>

                    <!-- Delete Account Section -->
                    <section class="profile-section" id="deleteSection">
                        <div class="section-header">
                            <h2>Delete Account</h2>
                        </div>
                        <p>Deleting your account will remove all your bookings, wishlist items, and account information. This action cannot be undone.</p>
                        <button type="button" class="btn btn-danger" id="deleteAccountBtn">Delete Account</button>
                    </section>
                </div>
            </section>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</head>
</body>

</html>
