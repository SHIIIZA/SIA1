<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf7ef">
    <title>You're offline — TripMate</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #faf7ef; color: #173b37; font: 16px/1.5 Inter, system-ui, sans-serif; text-align: center; }
        main { max-width: 440px; }
        img { width: 88px; height: 88px; object-fit: contain; }
        h1 { margin: 20px 0 8px; }
        p { color: #526762; }
        button { margin-top: 12px; padding: 12px 20px; border: 0; border-radius: 999px; background: #173b37; color: white; font: inherit; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="images/app-icon.png" alt="">
        <h1>You’re offline</h1>
        <p>TripMate couldn’t reach the internet. Your saved stays and account details are not available until you reconnect.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
