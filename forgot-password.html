<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripMate — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/forgot-password.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(180deg, rgba(6, 43, 39, 0.45) 0%, rgba(6, 43, 39, 0.72) 100%),
        url("https://images.unsplash.com/photo-1580619305218-8423a7ef79b4?auto=format&fit=crop&w=1800&q=80") center/cover no-repeat fixed;
    }
  </style>
</head>

<body>

  <header class="top-nav">
    <a href="home.html" class="logo">
      <img src="images/tripmate.svg" alt="TripMate" class="logo-img">
    </a>
    <a href="login.html" class="back-link">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to log in
    </a>
  </header>

  <main>
    <div class="card">

      <div id="request">
        <h1>Reset your password</h1>
        <p class="sub">Enter the email tied to your account and we'll send a link to reset it.</p>

        <form id="reset-form" novalidate>
          <div class="field" id="f-email">
            <label for="email">Email Address</label>
            <span class="field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 6 12 13 2 6" />
                <path d="M2 6h20v12H2z" />
              </svg>
            </span>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
            <div class="error-msg">No account found with this email.</div>
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">
            Send Reset Link
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>

        <p class="foot-link">Remembered it? <a href="login.html">Log in</a></p>
      </div>

      <div id="confirm-panel" class="confirm-panel">
        <div class="confirm-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 6 12 13 2 6" />
            <path d="M2 6h20v12H2z" />
          </svg>
        </div>
        <h1>Check your inbox</h1>
        <p class="sub">We sent a password reset link to <span class="email-highlight" id="sentEmail"></span>. It should arrive within a couple of minutes.</p>
        <button type="button" class="btn-primary" id="backToLoginBtn">
          Back to Log In
        </button>
        <p class="foot-link">Didn't get it? <a href="#" id="resendLink">Resend link</a></p>
      </div>

    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    const requestPanel = document.getElementById("request-panel");
    const confirmPanel = document.getElementById("confirm-panel");
    const form = document.getElementById("reset-form");
    const emailField = document.getElementById("f-email");
    const submitBtn = document.getElementById("submit-btn");
    const sentEmail = document.getElementById("sentEmail");

    function sendResetLink(email) {
      requestPanel.style.display = "none";
      confirmPanel.classList.add("show");
      sentEmail.textContent = email;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      clearFieldError(emailField);

      const email = document.getElementById("email").value.trim();

      if (!isValidEmail(email)) {
        setFieldError(emailField, "Enter a valid email address.");
        return;
      }
      if (!findUser(email)) {
        setFieldError(emailField, "No account found with this email.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      setTimeout(() => {
        sendResetLink(email);
      }, 500);
    });

    document.getElementById("backToLoginBtn").addEventListener("click", () => {
      window.location.href = "login.html";
    });

    document.getElementById("resendLink").addEventListener("click", (e) => {
      e.preventDefault();
      showToast(`Reset link re-sent to ${sentEmail.textContent}.`);
    });
  </script>
</body>

</html>
